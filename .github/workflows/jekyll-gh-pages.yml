# Publica la web en GitHub Pages cada vez que se sube algo a la rama main
# Guardar como: .github/workflows/deploy.yml
name: Desplegar en GitHub Pages

on:
  # Se ejecuta al hacer push a main
  push:
    branches: ['main']
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

# Permisos mínimos que necesita para publicar
permissions:
  contents: read
  pages: write
  id-token: write

# Si hay dos despliegues a la vez, cancela el anterior
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pnpm se instala ANTES que Node para que la caché de pnpm funcione
      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
        # Lee la versión de "packageManager" en el package.json.
        # Si tu package.json no tiene esa línea, añade debajo:  with: { version: 11 }

      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Construir
        run: pnpm run build

      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Subir el resultado (carpeta dist)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
